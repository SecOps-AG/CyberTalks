name: Sync talks

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Comma-separated data files to sync (blank = full)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "data/villages/**"
      - "data/materials/**"
      - "data/events.json"
      - "data/taxonomy.json"
      - "data/view-counts.json"
      - "migrations/d1/**"
      - "scripts/d1/**"
      - "src/lib/d1/**"

concurrency:
  group: sync-talks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upsert changed talks
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FILES_INPUT: ${{ inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$FILES_INPUT" ]; then
              npx tsx scripts/d1/sync.ts --remote --files "$FILES_INPUT"
            else
              npx tsx scripts/d1/sync.ts --remote --full
            fi
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            npx tsx scripts/d1/sync.ts --remote --full
          else
            npx tsx scripts/d1/sync.ts --remote --since "${{ github.event.before }}"
          fi
      # The upsert above is what makes new talk pages live. Best effort: the
      # script skips quietly until the IndexNow key file is served, and never
      # fails this job.
      - name: Ping IndexNow for new and changed talks
        if: success() && github.event_name == 'push'
        continue-on-error: true
        run: npx tsx scripts/indexnow.ts --since "${{ github.event.before }}"
