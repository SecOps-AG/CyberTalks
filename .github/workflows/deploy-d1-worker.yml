name: Deploy cybertalks-d1

on:
  push:
    branches: [main]
    paths:
      - "scripts/d1/deploy-once"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "migrations/d1/**"

concurrency:
  group: deploy-cybertalks-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the one-shot marker
        run: test -f scripts/d1/deploy-once
      - name: Deploy cybertalks-d1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run deploy
